[package]
name = "groq-lint"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
colored = "2"
groq-parser = { git = "https://github.com/sanity-io/groq-parser-rs.git" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
terminal_size = "0.4"
textwrap = "0.16"