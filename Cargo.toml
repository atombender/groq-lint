[package]
name = "groq-lint"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["cli"]
cli = ["clap", "colored", "miette", "terminal_size", "textwrap"]
wasm = ["wasm-bindgen", "console_error_panic_hook", "serde_json"]

[dependencies]
groq-parser = { git = "https://github.com/sanity-io/groq-parser-rs.git" }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"

# CLI-only dependencies
clap = { version = "4.5", features = ["derive"], optional = true }
colored = { version = "2", optional = true }
miette = { version = "7", features = ["fancy"], optional = true }
terminal_size = { version = "0.4", optional = true }
textwrap = { version = "0.16", optional = true }

# WASM-only dependencies
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
serde_json = { version = "1.0", optional = true }