name: basic-rules
version: 1.0

# === Documentation ===
#
# Each rule has a unique ID, a pattern, an advice, a category, and a severity:
#
# * The pattern is an English description of the GROQ construct being matched.
# * The advice is a short explanation of the problem and how to fix it.
#
# The context determines when the rule is applied:
# * "expr" (default) means the rule is applied to each expression in the query.
# * "whole_query" means the rule is only applied once, to the entire query.
#
# A rule can have `supercedes`, a list of other rule IDs which this rule replaces.
# If the rule matches, any findings from the superceded rules are unnecessary.

rules:
  - id: join_in_filter
    pattern: |
      Any dereference operator (->) occurring within the constraint expression of a filter ([ ])
      over documents read from the dataset (`*`, possibly filtered, projected, ordered, sliced or
      flattened). This includes filters over attribute arrays nested inside such a filter
      (e.g., `*[count(reviews[@->rating > 3]) > 0]`).
      Filters over an attribute array of a single document inside a projection
      (e.g., `*{"r": reviews[@->title == "x"]}`) are not flagged, since there is no index read to lose.
    advice: |
      Avoid joins (`->`) inside filters. It prevents optimization.
      `a->b == "c"` can be more optimally written `a._ref in *[b == "c"]._id`.
    category: performance
    severity: high

  - id: join_to_get_id
    pattern: |
      Using a dereference operator (->) to retrieve the _id of a document.
    advice: |
      Avoid using a dereference operator (`->`) to retrieve the `_id` of a document.
      `a->b._id` can be more optimally written as `a._ref`.
    category: performance
    severity: medium

  - id: computed_value_in_filter
    pattern: |
      Binary operators like '+', '-', '*', '/' occurring within the constraint expression of a filter ([ ])
      that applies directly to the dataset (`*`), EXCEPT when:
      - one side references a parent scope (^), which enables efficient correlated subquery execution; or
      - one side involves a `dateTime()` call (e.g., `dateTime(now()) + 1`), the standard way to do date
        math in GROQ.
      Filters applied to sub-arrays (e.g., `things[foo == "x" + y]` inside a projection) are not flagged,
      since dataset indices don't apply there anyway.
      Also, calls that are evaluated in memory for every candidate document, occurring within the
      constraint expression of a filter over documents (`*`, possibly filtered, projected, ordered,
      sliced or flattened), unless the call references a parent scope (^):
      - `upper()`, `length()`, `round()`, `coalesce()` and `select()`;
      - `defined()` of an array element (e.g., `defined(reviews[0])`);
      - an element of `string::split()` (e.g., `string::split(title, " ")[0]`).
      Functions the index evaluates itself, such as `lower()`, `dateTime()`, `string::startsWith()`,
      `pt::text()`, `count(arr)`, `path()` and `references()`, are not flagged.
    advice: |
      Avoid computed values (concatenation, arithmetic, etc.) in filters. Indices cannot be used.
      Consider adding additional filters to reduce the search space.
    category: performance
    severity: high

  - id: match_on_id
    pattern: |
      `_id match "<string containing wildcards>"`
    advice: |
      `match` is intended for full-text matching and may not work as expected on `_id`.
    category: correctness
    severity: low

  - id: order_on_expr
    pattern: |
      order() where one or more argument is not:
      * `<attribute> [asc|desc]` (plain attribute)
      * `lower(<attribute>) [asc|desc]` (lowercasing)
      * `dateTime(<attribute>) [asc|desc]` (coerce to datetime)
      * `geo::distance(<attribute>, <constant>)` [asc|desc] (geo distance)
    advice: |
      Avoid ordering on computed values. Indices cannot be used to sort, which means the entire
      result set must be materialized before sorting.
    category: performance
    severity: high

  - id: deep_pagination
    pattern: |
      Slice or element access expressions on documents read from the dataset (`*`, possibly filtered,
      projected, ordered or flattened) where the start index is a literal integer >= 1000
      (e.g., `*[_type == "x"][1000...1010]` or `*[_type == "x"][5000]`).
      Slices of an attribute array of a single document (e.g., `*{"r": reviews[1500..1600]}`) are
      taken in memory and are not flagged. Ranges outside a slice (e.g., `x in 1000..2000`) are not flagged.
    advice: |
      Deep pagination is slow. Consider using cursor-based pagination (e.g., using `_id`).
    category: performance
    severity: medium

  - id: deep_pagination_param
    pattern: |
      Slice or element access expressions on documents read from the dataset where the start index
      is a $param (e.g., `*[_type == "x"][$start...$end]` or `*[_type == "x"][$start]`).
      Slices of an attribute array of a single document are not flagged.
    advice: |
      If given a large value, this can cause deep pagination, which is slow.
      Consider using cursor-based pagination (e.g., using `_id`).
    category: performance
    severity: medium

  - id: large_pages
    pattern: |
      Slice expressions on documents read from the dataset where the start index is zero (or omitted)
      and the end index is a literal integer greater than 100.
      Slices of an attribute array of a single document are not flagged.
    advice: |
      Fetching many results at once can be slow. Consider breaking into smaller,
      discrete batches and/or cursor-based pagination (e.g., using `_id`).
    category: performance
    severity: medium

  - id: unlimited_query
    pattern: |
      The top-level query expression queries the dataset (`*`) and has no slice or single-element
      access anywhere along its outer chain. For example: `*[_type == "article"]`.
      Only the top-level query is checked — subqueries (e.g., `count(*[...])`, correlated
      subqueries in projection fields) are not flagged.
      Exclude false positives:
      - Exclude filters that constrain by `_id == ...` or `slug.current == ...` (either as the
        sole constraint or in an AND-chain), as this will always fetch <= 1 results. Note that
        `_id != ...` and `_id in [...]` are not exempted.
      - Exclude expressions where a slice (`[a..b]`, `[a...b]`) or single-element access (`[N]`)
        appears anywhere along the outer chain — including after a projection, ordering, array
        coercion, or join. For example, `*[_type == "article"]{_id}[0..100]` is sliced even though
        the slicing happens after a projection.
    advice: |
      Fetching many results at once can be slow. Consider adding a limit like `[0...100]`
      and/or using cursor-based pagination (e.g., using `_id`).
    category: performance
    severity: medium

  - id: non_literal_comparison
    pattern: |
      Comparison operators (==, !=, <, >, <=, >=) where both the left-hand and right-hand sides
        are non-literal expressions (e.g., attributes, function calls, concatenation, etc.):
      - Literal expressions that only involve literals (e.g. 2+1 or "foo" + "bar") are considered
        literals.
      - now() is considered a literal.
      - `dateTime(x)` and `lower(x)` take on the nature of `x`, since the index evaluates them:
        `dateTime("2020-01-01T00:00:00Z")` is a literal, and `lower(^.name)` is a parent-scope
        reference.
      - Params (e.g. foo) are considered literals.
      - Referring to a parent-scope attribute (e.g., `foo == ^.bar`) on either left or right side is fine
        and not covered by this rule. This extends to dereferences rooted in a parent ref
        (e.g., `foo._ref == ^.library->_id`), which still resolve through the parent scope.
      - Comparisons where one side is a subquery rooted in `*` (e.g., `foo == *[0].foo`) are
        not covered by this rule.
    advice: |
      Comparisons between two non-literal fields cannot be executed in an efficient manner.
      Consider adding additional filters to reduce the search space.
    category: performance
    severity: high

  - id: count_in_correlated_subquery
    pattern: |
      count() function calls on a correlated subquery where a filter over documents has a term in its
      `&&` chain that references a parent scope (^) and is neither an equality with ^ on exactly one
      side (e.g., `author._ref == ^._id`) nor `references(^...)`. For example,
      `count(*[_createdAt > ^._createdAt])`, `count(*[^._id in refs[]._ref])` or
      `count(*[a == ^._id || b == ^._id])`.
      Equality and `references()` conditions are batched into one index read keyed on the parent
      value, so `count(*[author._ref == ^._id])` is not flagged, including when the subquery is
      projected, ordered or sliced.
    advice: |
      Using count() on a correlated subquery whose `^` condition is not an equality or `references()` can be slow.
      Every document matched by the rest of the subquery is read, then filtered in memory for each row.
    category: performance
    severity: low

  - id: very_large_query
    pattern: |
      The raw GROQ query is larger than 10KB.
    advice: |
      This query is very large, and may execute very slowly; it may be deprioritized by the server.
    context: whole_query
    category: performance
    severity: high

  - id: extremely_large_query
    pattern: |
      The raw GROQ query is larger than 100KB.
    advice: |
      This query is extremely large, and may execute very slowly; it may be deprioritized by the server.
    context: whole_query
    category: performance
    severity: high
    supercedes: [very_large_query]

  - id: many_joins
    pattern: |
      The query uses more than 10 distinct joins. Joins on the same reference path within the same
      projection or filter (e.g., `author->name` and `author->bio`) are merged and count once.
      A chain of hops (e.g., `a->b->c`) counts each hop, and joins on a computed path each count.
    advice: |
      This query uses many joins, and may have poor performance as a result.
    context: whole_query
    category: performance
    severity: medium
